name: keep-alive

# Evita que Render (free) se duerma por inactividad y despierta Neon con un SELECT 1.
# GitHub puede retrasar los crons unos minutos; alcanza para mantenerlo tibio.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API + DB
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 "https://nula.onrender.com/api/health?db=1"
